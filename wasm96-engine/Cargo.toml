[package]
name = "wasm96-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
# Runtime: Wasmtime (broader feature support + WASI integration)
wasmtime = { version = "39.0.1", features = ["cranelift", "pooling-allocator", "profiling"] }
wasmtime-wasi = { version = "39.0.1" }

# Error handling
anyhow = "1.0.99"

# OpenGL bindings
gl = "0.14"

# Rendering / assets
fontdue = "0.9.3"
gif = "0.13.1"
png = "0.17.16"
jpeg-decoder = "0.3.2"
resvg = { version = "0.44.0", default-features = false, features = ["text"] }
tiny-skia = "0.11"
asefile = "0.3.8"
image = "0.24"
lazy_static = "1.4"

# Audio
hound = "3.5.1"
qoaudio = "0.1.0"
xmrs = { version = "0.9.7", features = ["import"] }
xmrsplayer = { version = "0.9.7" }

# 3D Graphics
wgpu = "28.0.0"
glam = "0.30.9"
bytemuck = { version = "1.24.0", features = ["derive"] }
tobj = "4.0.3"
ahash = "0.8.11"
nom_stl = "0.2.2"

# Used to parse `.wat` text into `.wasm` bytes before passing to the runtime.
wat = "1.243.0"

# MIDI parsing
midly = "0.5"

[profile.dev]
panic = "abort"
